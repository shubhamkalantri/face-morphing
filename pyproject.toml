[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-morphing"
version = "0.1.0"
description = "Face morphing by Delaunay triangulation with affine warps, and by meshless inverse-distance weighting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "opencv-python",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["morphing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests import `morphing` from the repo root without an install step.
pythonpath = ["."]
addopts = "-q"
